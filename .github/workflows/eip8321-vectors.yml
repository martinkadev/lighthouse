name: eip8321-vectors

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - stable
      - unstable
      - 'pr/*'

env:
  RUSTFLAGS: "-D warnings -C debuginfo=0"
  CARGO_INCREMENTAL: 0
  RAYON_NUM_THREADS: 2

jobs:
  eip8321-vectors:
    name: eip8321-vectors (${{ matrix.preset }}, ${{ matrix.crypto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mainnet, minimal]
        crypto: [real, fake]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release

      - name: Download published EIP-8321 vectors
        run: testing/ef_tests/download_eip8321_vectors.sh "${{ matrix.preset }}"

      - name: Run EIP-8321 EF suites
        env:
          EIP8321_RESULTS_PATH: ${{ runner.temp }}/case-results.jsonl
        run: |
          features=eip8321_tests,portable
          if [ "${{ matrix.preset }}" = minimal ]; then
            features="$features,spec-minimal"
          fi
          if [ "${{ matrix.crypto }}" = fake ]; then
            features="$features,fake_crypto"
          fi
          cargo test --locked -p ef_tests --release --features "$features" \
            --test tests -- --test-threads=1 --nocapture

      - name: Upload per-case outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eip8321-results-${{ matrix.preset }}-${{ matrix.crypto }}
          path: ${{ runner.temp }}/case-results.jsonl
          if-no-files-found: error

  eip8321-coverage:
    name: eip8321-coverage (${{ matrix.preset }})
    needs: [eip8321-vectors]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [mainnet, minimal]
    steps:
      - uses: actions/checkout@v4
      - name: Download published fixtures
        run: testing/ef_tests/download_eip8321_vectors.sh "${{ matrix.preset }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: eip8321-results-${{ matrix.preset }}-*
          path: results
      - name: Require every executable fixture to pass
        run: python3 testing/ef_tests/check_eip8321_coverage.py "${{ matrix.preset }}" results/*/case-results.jsonl
