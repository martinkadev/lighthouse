# EIP-8321 interop, one direction: Prysm produces every block, Lighthouse only follows.
#
# Useful for isolating failures: if this network is healthy but network_params_interop.yaml
# is not, Prysm is rejecting blocks or messages produced by Lighthouse.
participants:
  - el_type: geth
    el_image: ethpandaops/geth:heze-devnet-2-66af2fe
    cl_type: prysm
    cl_image: bct/prysm-beacon:eip8321-minimal
    vc_image: bct/prysm-validator:eip8321-minimal
    vc_extra_params:
      - --enable-beacon-rest-api
    supernode: true
    count: 2
    validator_count: 64

  - el_type: geth
    el_image: ethpandaops/geth:heze-devnet-2-66af2fe
    cl_type: lighthouse
    cl_image: lighthouse:eip8321-minimal
    supernode: true
    cl_extra_params:
      - --target-peers=3
    count: 1
    validator_count: 0

network_params:
  preset: minimal
  genesis_delay: 120
  electra_fork_epoch: 0
  fulu_fork_epoch: 0
  gloas_fork_epoch: 0
  heze_fork_epoch: 0
  eip8321_fork_epoch: 4
  eip8321_fork_version: '0xe8321101'

global_log_level: debug
additional_services: []
wait_for_finalization: false
